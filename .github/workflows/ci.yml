name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - name: Unit and fuzz tests
        run: forge test --no-match-contract ForkTest
      - name: GIWA Sepolia fork tests
        run: forge test --match-contract ForkTest
        env:
          GIWA_SEPOLIA_RPC_URL: https://sepolia-rpc.giwa.io
